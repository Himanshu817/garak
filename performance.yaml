system:
  # Parallel processing settings
  parallel_requests: null  # Will default to CPU count - 1
  parallel_attempts: null  # Will default to CPU count - 1
  
  # Timeouts (in seconds)
  request_timeout: 30
  attempt_timeout: 120
  
  # Batch processing settings
  generator_chunk_size: 10  # Maximum number of prompts to process in one batch for generators
  probe_chunk_size: 5      # Maximum number of attempts to process in one batch for probes
  
  # Caching settings
  enable_result_cache: true
  cache_size: 1000        # Maximum number of results to cache
  cache_ttl: 3600        # Time to live for cached results in seconds